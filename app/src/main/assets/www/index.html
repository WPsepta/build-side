<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Map Editor</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#111; overflow:hidden; font-family:sans-serif; }
    #wrap { display:flex; flex-direction:column; height:100%; align-items:center; justify-content:center; }
    canvas { background:#2e7d32; border:4px solid #1b5e20; image-rendering:pixelated; touch-action:none; max-width:100%; max-height:70vh; }
    .palette { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:0 8px; }
    .tile-btn { width:60px; height:60px; border:3px solid #333; border-radius:8px; color:#fff; font-size:12px; font-weight:bold; }
    .tile-btn.selected { outline:3px solid #fff; }
    .grass { background:#4caf50; }
    .dirt { background:#795548; }
    .water { background:#2196f3; }
    .stone { background:#9e9e9e; color:#000; }
    .label { color:#fff; font-size:12px; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="map" width="480" height="480"></canvas>
    <div class="palette">
      <button class="tile-btn grass selected" data-type="grass" onclick="selectTool('grass', this)">Rumput</button>
      <button class="tile-btn dirt" data-type="dirt" onclick="selectTool('dirt', this)">Tanah</button>
      <button class="tile-btn water" data-type="water" onclick="selectTool('water', this)">Air</button>
      <button class="tile-btn stone" data-type="stone" onclick="selectTool('stone', this)">Batu</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');
    const TILE = 32;
    const COLS = Math.floor(canvas.width / TILE);
    const ROWS = Math.floor(canvas.height / TILE);
    const COLORS = { grass:'#4caf50', dirt:'#795548', water:'#2196f3', stone:'#9e9e9e' };

    let grid = [];
    for (let r = 0; r < ROWS; r++) { grid[r] = []; for (let c = 0; c < COLS; c++) grid[r][c] = 'grass'; }

    let currentTool = 'grass';
    let drawing = false;

    function selectTool(type, btn) {
      currentTool = type;
      document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function cellFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      const col = Math.floor(x / TILE);
      const row = Math.floor(y / TILE);
      if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return null;
      return { col, row };
    }

    function paintCell(cell) {
      if (!cell) return;
      grid[cell.row][cell.col] = currentTool;
      render();
    }

    function render() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          ctx.fillStyle = COLORS[grid[r][c]] || '#2e7d32';
          ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
        }
      }
      // grid lines
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      for (let c = 0; c <= COLS; c++) {
        ctx.beginPath(); ctx.moveTo(c*TILE,0); ctx.lineTo(c*TILE,canvas.height); ctx.stroke();
      }
      for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath(); ctx.moveTo(0,r*TILE); ctx.lineTo(canvas.width,r*TILE); ctx.stroke();
      }
    }

    canvas.addEventListener('pointerdown', e => {
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      paintCell(cellFromEvent(e));
    });
    canvas.addEventListener('pointermove', e => {
      if (drawing) paintCell(cellFromEvent(e));
    });
    canvas.addEventListener('pointerup', e => { drawing = false; });
    canvas.addEventListener('pointercancel', e => { drawing = false; });

    function addTileRandom(type) {
      const r = Math.floor(Math.random() * ROWS);
      const c = Math.floor(Math.random() * COLS);
      grid[r][c] = (COLORS[type] ? type : currentTool);
      render();
    }

    window.addTileRandom = addTileRandom;
    window.selectTool = selectTool;

    render();
  </script>
</body>
</html>
